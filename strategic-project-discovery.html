<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Strategic Project Discovery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg0:#141413; --bg1:#1a1917; --bg2:#1f1e1c; --bg3:#252321;
    --bd:#2e2c29; --bdb:#3a3835;
    --tp:#faf9f5; --ts:#b0aea5; --tm:#6b6966;
    --cyan:#00E5FF; --cyanD:rgba(0,229,255,0.12);
    --green:#00E676; --greenD:rgba(0,230,118,0.12);
    --amber:#FFAB40; --amberD:rgba(255,171,64,0.12);
    --red:#FF5252; --redD:rgba(255,82,82,0.12);
    --blue:#448AFF;
    --mono:'Segoe UI','Segoe UI Variable',Arial,sans-serif; --sans:'Segoe UI','Segoe UI Variable',Arial,sans-serif;
  }
  html,body { height:100%; background:var(--bg0); color:var(--tp); font-family:var(--mono); overflow:hidden; }
  #root { display:flex; flex-direction:column; height:100vh; }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:52px; background:var(--bg1); border-bottom:1px solid var(--bd); flex-shrink:0; }
  .topbar-logo { display:flex; align-items:center; gap:10px; font-size:10px; font-weight:600; letter-spacing:0.18em; color:var(--cyan); text-transform:uppercase; }
  .topbar-sub { font-size:10px; color:var(--tm); margin-left:4px; }
  .topbar-right { display:flex; align-items:center; gap:16px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .topbar-meta { font-size:10px; color:var(--tm); }
  .folder-btn { padding:4px 10px; cursor:pointer; background:transparent; border:1px solid var(--bd); color:var(--tm); font-family:var(--mono); font-size:10px; letter-spacing:0.08em; border-radius:2px; transition:all 0.15s; white-space:nowrap; }
  .folder-btn:hover { border-color:var(--bdb); color:var(--ts); }
  .folder-btn { display:flex; align-items:center; gap:4px; }

  /* Demo mode */
  .mode-pill { font-size:10px; font-weight:600; letter-spacing:0.12em; padding:4px 8px; border-radius:2px; }
  .mode-demo { color:var(--amber); background:var(--amberD); border:1px solid rgba(255,171,64,0.35); }
  .demo-banner { display:flex; align-items:center; gap:10px; padding:8px 20px; background:var(--amberD); border-bottom:1px solid rgba(255,171,64,0.25); color:var(--amber); font-size:12px; line-height:1.4; flex-shrink:0; }
  .demo-banner span { flex:1; }
  .demo-banner-btn { padding:4px 10px; cursor:pointer; background:transparent; border:1px solid rgba(255,171,64,0.5); color:var(--amber); font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; border-radius:2px; white-space:nowrap; }
  .demo-banner-btn:hover { background:rgba(255,171,64,0.18); }
  .key-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:2000; padding:16px; }
  .key-modal { width:100%; max-width:460px; background:var(--bg2); border:1px solid var(--bdb); border-radius:4px; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .key-title { font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan); }
  .key-text { font-size:12px; line-height:1.55; color:var(--ts); }
  .key-text a { color:var(--cyan); }
  .key-input { width:100%; padding:9px 10px; background:var(--bg0); border:1px solid var(--bd); border-radius:2px; color:var(--tp); font-family:var(--mono); font-size:12px; }
  .key-input:focus { outline:none; border-color:var(--cyan); }
  .key-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .key-save { border-color:var(--cyan); color:var(--cyan); }
  .key-save:disabled { opacity:0.4; cursor:not-allowed; }

  .statsbar { display:flex; background:var(--bg1); border-bottom:1px solid var(--bd); flex-shrink:0; overflow-x:auto; }
  .stat-item { display:flex; align-items:center; gap:10px; padding:8px 20px; border-right:1px solid var(--bd); white-space:nowrap; }
  .stat-label { font-size:10px; color:var(--tm); letter-spacing:0.1em; text-transform:uppercase; }
  .stat-value { font-size:15px; font-weight:700; }
  .sv-cyan{color:var(--cyan);} .sv-green{color:var(--green);} .sv-amber{color:var(--amber);} .sv-red{color:var(--red);}

  .main-layout { display:flex; flex:1; overflow:hidden; }

  .sidebar { width:260px; flex-shrink:0; background:var(--bg1); border-right:1px solid var(--bd); display:flex; flex-direction:column; }
  .sidebar-header { padding:14px 16px 10px; border-bottom:1px solid var(--bd); font-size:10px; color:var(--tm); letter-spacing:0.12em; text-transform:uppercase; }
  .sidebar-sectors { flex:1; overflow-y:auto; padding:8px 0; }
  .sidebar-sectors::-webkit-scrollbar{width:3px;} .sidebar-sectors::-webkit-scrollbar-thumb{background:var(--bdb);}
  .sector-item { display:flex; align-items:flex-start; gap:10px; padding:10px 16px; cursor:pointer; border-left:2px solid transparent; transition:all 0.15s; }
  .sector-item:hover { background:var(--bg3); }
  .sector-item.active { background:var(--cyanD); border-left-color:var(--cyan); }
  .sector-item.scanning { background:rgba(0,212,255,0.05); border-left-color:var(--cyan); animation:secpulse 1.5s infinite; }
  @keyframes secpulse{0%,100%{border-left-color:var(--cyan);}50%{border-left-color:transparent;}}
  .sector-icon { display:flex; align-items:center; flex-shrink:0; margin-top:2px; }
  .sector-name { font-size:12px; font-weight:500; color:var(--tp); line-height:1.4; font-family:var(--sans); }
  .sector-item.active .sector-name { color:var(--cyan); }
  .sector-count { font-size:10px; color:var(--tm); margin-top:2px; }
  .sector-badge { flex-shrink:0; font-size:10px; font-weight:600; background:var(--bg3); color:var(--tm); border:1px solid var(--bd); padding:2px 5px; border-radius:2px; margin-top:2px; }
  .sector-item.active .sector-badge { background:var(--cyanD); color:var(--cyan); border-color:rgba(0,212,255,0.3); }
  .sidebar-footer { padding:12px 16px; border-top:1px solid var(--bd); }
  .scan-all-btn { width:100%; padding:10px; cursor:pointer; background:var(--cyanD); border:1px solid rgba(0,212,255,0.3); color:var(--cyan); font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; border-radius:2px; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .scan-all-btn:hover:not(:disabled){background:rgba(0,212,255,0.2);}
  .scan-all-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .scan-all-btn.scanning{animation:btnpulse 1s infinite;}
  @keyframes btnpulse{0%,100%{background:var(--cyanD);}50%{background:rgba(0,212,255,0.22);}}

  .content-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--bg1); border-bottom:1px solid var(--bd); flex-shrink:0; flex-wrap:wrap; }
  .toolbar-title { font-size:12px; font-weight:600; letter-spacing:0.06em; flex:1; min-width:0; }
  .region-select { background:var(--bg2); border:1px solid var(--bd); color:var(--ts); font-family:var(--mono); font-size:12px; padding:5px 10px; border-radius:2px; cursor:pointer; }
  .region-select:focus{outline:none;border-color:var(--cyan);}
  .scan-btn { padding:7px 16px; cursor:pointer; background:var(--cyanD); border:1px solid rgba(0,212,255,0.3); color:var(--cyan); font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; border-radius:2px; display:flex; align-items:center; gap:6px; }
  .scan-btn:hover:not(:disabled){background:rgba(0,212,255,0.2);}
  .scan-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .action-btn { padding:6px 12px; cursor:pointer; background:var(--bg3); border:1px solid var(--bd); color:var(--ts); font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; border-radius:2px; display:flex; align-items:center; gap:5px; transition:all 0.15s; white-space:nowrap; }
  .action-btn:hover{border-color:var(--bdb);color:var(--tp);}
  .action-btn.saved{color:var(--green);border-color:rgba(0,255,157,0.3);background:var(--greenD);}
  .load-wrap { position:relative; }
  .load-dropdown { position:absolute; top:calc(100% + 4px); right:0; min-width:240px; background:var(--bg2); border:1px solid var(--bdb); border-radius:3px; z-index:999; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
  .load-item { padding:9px 14px; font-size:12px; color:var(--ts); cursor:pointer; border-bottom:1px solid var(--bd); font-family:var(--sans); display:flex; flex-direction:column; gap:2px; transition:background 0.1s; }
  .load-item:last-child{border-bottom:none;}
  .load-item:hover{background:var(--bg3);color:var(--tp);}
  .load-item-label{font-size:12px;color:var(--tp);}
  .load-item-meta{font-size:10px;color:var(--tm);}
  .load-empty{padding:12px 14px;font-size:12px;color:var(--tm);text-align:center;}
  .spinner { width:10px; height:10px; border:1.5px solid rgba(0,212,255,0.3); border-top-color:var(--cyan); border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg);}}

  .tab-bar { display:flex; align-items:center; background:var(--bg1); border-bottom:1px solid var(--bd); flex-shrink:0; padding:0 16px; }
  .tab-btn { padding:10px 16px; font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--tm); cursor:pointer; border:none; background:none; font-family:var(--mono); border-bottom:2px solid transparent; margin-bottom:-1px; transition:all 0.15s; }

  .tab-btn:hover{color:var(--ts);}
  .tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan);}

  .results-area { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .results-area::-webkit-scrollbar{width:4px;} .results-area::-webkit-scrollbar-thumb{background:var(--bdb);border-radius:2px;}

  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:var(--tm); }
  .empty-icon{font-size:36px;opacity:0.4;} .empty-title{font-size:12px;letter-spacing:0.1em;}
  .empty-sub{font-size:12px;text-align:center;max-width:300px;line-height:1.6;}
  .scanning-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1;}
  .scan-ring{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--bd);position:relative;}
  .scan-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--cyan);animation:spin 1s linear infinite;}
  .scan-ring::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid var(--bdb);}
  .scan-text{font-size:12px;color:var(--cyan);letter-spacing:0.12em;} .scan-sub{font-size:10px;color:var(--tm);}

  .result-card{background:var(--bg2);border:1px solid var(--bd);border-radius:3px;overflow:hidden;cursor:pointer;transition:border-color 0.15s;animation:cardin 0.3s ease;flex-shrink:0;}
  @keyframes cardin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .result-card:hover{border-color:var(--bdb);}
  .result-card.expanded{border-color:var(--cyan);}
  .card-header{padding:12px 14px;display:flex;align-items:flex-start;gap:12px;}
  .card-score-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;}
  .score-ring{width:44px;height:44px;position:relative;}
  .score-ring svg{width:44px;height:44px;transform:rotate(-90deg);}
  .score-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .score-text{font-size:10px;color:var(--tm);letter-spacing:0.06em;}
  .card-main{flex:1;min-width:0;}
  .card-badges{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap;}
  .badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:1px;letter-spacing:0.08em;text-transform:uppercase;border:1px solid;}
  .b-pipeline{background:rgba(68,138,255,0.12);color:#448AFF;border-color:rgba(68,138,255,0.35);}
  .b-procurement{background:rgba(255,171,64,0.12);color:#FFAB40;border-color:rgba(255,171,64,0.35);}
  .b-live{background:rgba(0,229,255,0.12);color:#00E5FF;border-color:rgba(0,229,255,0.35);}
  .b-awarded{background:rgba(255,82,82,0.12);color:#FF5252;border-color:rgba(255,82,82,0.35);}
  .b-high{background:rgba(255,82,82,0.12);color:#FF5252;border-color:rgba(255,82,82,0.35);}
  .b-medium{background:rgba(255,171,64,0.12);color:#FFAB40;border-color:rgba(255,171,64,0.35);}
  .b-low{background:rgba(124,77,255,0.12);color:#7C4DFF;border-color:rgba(124,77,255,0.35);}
  .b-region{background:var(--bg3);color:var(--ts);border-color:var(--bd);}
  .card-title{font-size:15px;font-weight:600;color:var(--tp);line-height:1.4;margin-bottom:4px;font-family:var(--sans);}
  .card-client{font-size:12px;color:var(--ts);}
  .card-meta{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap;}
  .meta-item{font-size:10px;color:var(--tm);display:flex;align-items:center;gap:4px;}
  .meta-item span{color:var(--ts);}
  .meta-label{color:var(--tm);text-transform:uppercase;letter-spacing:0.08em;font-size:10px;}
  .card-expand-btn{flex-shrink:0;color:var(--tm);font-size:12px;padding:4px;transition:transform 0.2s,color 0.2s;}
  .result-card.expanded .card-expand-btn{transform:rotate(180deg);color:var(--cyan);}
  .card-body{border-top:1px solid var(--bd);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .detail-title{font-size:10px;color:var(--tm);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .detail-title::after{content:'';flex:1;height:1px;background:var(--bd);}
  .detail-text{font-size:12px;color:var(--ts);line-height:1.7;font-family:var(--sans);}
  .gia-panel{grid-column:1/-1;background:var(--bg3);border:1px solid var(--bdb);border-radius:2px;padding:12px;}
  .gia-title{font-size:10px;color:var(--cyan);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .gia-title-icon{display:inline-block;vertical-align:middle;margin-right:4px;}
  .gia-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .gia-item-label{font-size:10px;color:var(--tm);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
  .gia-bar-wrap{height:4px;background:var(--bg0);border-radius:2px;overflow:hidden;margin-bottom:3px;}
  .gia-bar{height:100%;border-radius:2px;}
  .gb-high{background:#00E676;} .gb-medium{background:#FFAB40;} .gb-low{background:#FF5252;}
  .gia-item-val{font-size:10px;color:var(--ts);}
  .gia-verdict{margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);font-size:12px;color:var(--ts);font-family:var(--sans);line-height:1.6;}
  .gia-verdict strong{color:var(--cyan);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.06em;}
  .error-msg{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.3);border-radius:2px;padding:12px 16px;font-size:12px;color:#ff4466;line-height:1.6;}

  /* map */
  .map-wrap { flex:1; position:relative; overflow:hidden; }
  .map-wrap .leaflet-container { background:#060810; }
  .map-legend { position:absolute; bottom:16px; left:16px; z-index:1000; background:rgba(12,15,26,0.92); border:1px solid var(--bd); border-radius:3px; padding:10px 14px; font-size:10px; color:var(--tm); letter-spacing:0.08em; text-transform:uppercase; pointer-events:none; }
  .map-legend-row { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .map-legend-row:last-child{margin-bottom:0;}
  .map-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .map-count { margin-top:8px; padding-top:8px; border-top:1px solid var(--bd); color:var(--ts); }

  /* sources */
  .sources-wrap { flex:1; overflow-y:auto; padding:16px; }
  .sources-wrap::-webkit-scrollbar{width:4px;} .sources-wrap::-webkit-scrollbar-thumb{background:var(--bdb);}
  .sources-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:16px; }
  .sources-title { font-size:15px; font-weight:600; letter-spacing:0.1em; color:var(--tp); }
  .sources-subtitle { font-size:10px; color:var(--tm); margin-top:3px; }
  .src-btn { padding:5px 12px; cursor:pointer; background:var(--bg3); border:1px solid var(--bd); color:var(--ts); font-family:var(--mono); font-size:10px; letter-spacing:0.08em; border-radius:2px; white-space:nowrap; transition:all 0.15s; }
  .src-btn:hover{border-color:var(--bdb);color:var(--tp);}
  .sources-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .source-group { background:var(--bg2); border:1px solid var(--bd); border-radius:3px; padding:12px; }
  .source-cat-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .source-cat-label { font-size:10px; color:var(--cyan); letter-spacing:0.12em; text-transform:uppercase; }
  .source-cat-toggle { font-size:10px; color:var(--tm); background:none; border:none; cursor:pointer; font-family:var(--mono); letter-spacing:0.06em; padding:0; transition:color 0.15s; }
  .source-cat-toggle:hover { color:var(--ts); }
  .source-item { display:flex; align-items:center; gap:8px; padding:5px 0; cursor:pointer; font-size:12px; color:var(--ts); font-family:var(--sans); border-bottom:1px solid var(--bd); transition:color 0.15s; }
  .source-item:last-child{border-bottom:none;}
  .source-item.active{color:var(--tp);}
  .source-item input[type=checkbox]{ accent-color:#4a4845; cursor:pointer; flex-shrink:0; }

  /* sectors tab */
  .sectors-wrap { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .sectors-wrap::-webkit-scrollbar{width:4px;} .sectors-wrap::-webkit-scrollbar-thumb{background:var(--bdb);}
  .sector-card { background:var(--bg2); border:1px solid var(--bd); border-radius:3px; overflow:hidden; flex-shrink:0; }
  .sector-card-header { padding:16px 18px 14px; border-bottom:1px solid var(--bd); }
  .sector-card-title { font-size:15px; font-weight:600; color:var(--tp); margin-bottom:4px; font-family:var(--sans); }
  .sector-card-tag { display:inline-block; font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; padding:2px 8px; border-radius:1px; border:1px solid; background:var(--cyanD); color:var(--cyan); border-color:rgba(217,119,87,0.3); }
  .sector-card-body { padding:16px 18px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .sector-section-label { font-size:10px; color:var(--cyan); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px; }
  .sector-section-text { font-size:12px; color:var(--ts); line-height:1.75; font-family:var(--sans); }
  .sector-keywords { display:flex; flex-wrap:wrap; gap:6px; }
  .sector-kw { font-size:10px; color:var(--ts); background:var(--bg3); border:1px solid var(--bd); border-radius:2px; padding:3px 8px; font-family:var(--mono); }

  /* definitions tab */
  .defs-wrap { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .defs-wrap::-webkit-scrollbar{width:4px;} .defs-wrap::-webkit-scrollbar-thumb{background:var(--bdb);}
  .defs-section { background:var(--bg2); border:1px solid var(--bd); border-radius:3px; overflow:hidden; flex-shrink:0; }
  .defs-section-title { padding:12px 16px; border-bottom:1px solid var(--bd); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--cyan); }
  .defs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
  .def-item { padding:14px 16px; border-right:1px solid var(--bd); border-bottom:1px solid var(--bd); }
  .def-item:nth-child(n) { border-right:1px solid var(--bd); }
  .def-name { font-size:15px; font-weight:600; color:var(--tp); margin-bottom:6px; font-family:var(--sans); display:flex; align-items:center; gap:8px; }
  .def-chip { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border-radius:1px; border:1px solid; }
  .def-text { font-size:12px; color:var(--ts); line-height:1.75; font-family:var(--sans); }
</style>
</head>

// Lucide icon helper — lucide UMD exposes icons as arrays of [tag, attrs] tuples
function Icon({name, size=14, strokeWidth=1.75, style}) {
  const L = window.lucide;
  if (!L) return null;
  const data = L[name];
  if (!Array.isArray(data)) return null;
  return React.createElement('svg', {
    xmlns:'http://www.w3.org/2000/svg',
    width:size, height:size,
    viewBox:'0 0 24 24',
    fill:'none',
    stroke:'currentColor',
    strokeWidth,
    strokeLinecap:'round',
    strokeLinejoin:'round',
    style:{display:'inline-block',verticalAlign:'middle',flexShrink:0,...(style||{})}
  }, ...data.map(([tag,attrs],i)=>React.createElement(tag,{key:i,...attrs})));
}
// Phosphor icon helper (web font via <i> tag)
function Ph({name, size=14, style}) {
  return React.createElement('i', {className:`ph ph-${name}`, style:{fontSize:size,lineHeight:1,display:'inline-block',verticalAlign:'middle',flexShrink:0,...(style||{})}});
}

const KEY_STORE = 'gia_gemini_key';

// A key saved in this browser wins; otherwise use the hardcoded one if it's been filled in.
// With no key the app runs in demo mode on the sample data in demo-data.js.
function getGeminiKey() {
  try { const k = localStorage.getItem(KEY_STORE); if (k) return k; } catch(e) {}
  return GEMINI_KEY && GEMINI_KEY !== 'YOUR_GEMINI_API_KEY' ? GEMINI_KEY : '';
}
function setGeminiKey(k) {
  try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch(e) {}
}

async function fetchDemoOpportunities(sectorName, region) {
  await new Promise(r => setTimeout(r, 900 + Math.random() * 700));
  const sector = SECTORS.find(s => s.name === sectorName);
  const all = (window.DEMO_OPPORTUNITIES || {})[sector?.id] || [];
  return all.filter(o => region === 'Global' || o.regionGroup === region).map(o => ({...o}));
}

async function fetchOpportunities(sectorName, region, enabledSources) {
  const key = getGeminiKey();
  if (!key) return fetchDemoOpportunities(sectorName, region);

  // Cap source list to 60 names to keep prompt within Gemini token limits
  const sourceSample = enabledSources.length
    ? enabledSources.slice(0, 60).map(s => s.name).join(', ')
    : 'all available procurement databases';

  const sectorHint = SECTOR_HINTS[sectorName] ? `\n\nSector guidance: ${SECTOR_HINTS[sectorName]}` : '';

  const prompt = `You are a strategic business development intelligence engine for GIA (Global Infrastructure Advisors). Find as many real, current infrastructure procurement opportunities as possible for sector: "${sectorName}" in region: "${region}". Return at least 8 and up to 20 results.${sectorHint}

Search specifically across these procurement databases and sources: ${sourceSample}.

Return ONLY a valid JSON array. Start with [ and end with ]. No markdown, no code fences, no explanation before or after.

Each object must have ALL these fields:
- title: string (specific project or tender name)
- client: string (procuring authority)
- region: string (specific country/city)
- lat: number (latitude of project location, e.g. 51.5)
- lng: number (longitude of project location, e.g. -0.1)
- stage: one of ["Pipeline","Procurement","Live Tender","Awarded"]
- urgency: one of ["High","Medium","Low"]
- relevance: integer 50-97
- value: string (e.g. "£2.4bn")
- deadline: string (e.g. "Q3 2025")
- type: string (e.g. "Design & Build")
- source: string (name of procurement database where found)
- overview: string (2-3 sentences)
- context: string (2-3 sentences)
- gia: { sectorFit: integer 0-100, scaleFit: integer 0-100, geoFit: integer 0-100, winProb: integer 0-100, verdict: string }`;

  const res = await fetch(GEMINI_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body: JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      tools:[{google_search:{}}],
      generationConfig:{ temperature:0.7, maxOutputTokens:8192 }
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    throw new Error(err?.error?.message || `Gemini API error ${res.status}`);
  }
  const data = await res.json();
  const text = (data?.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('');
  const stripped = text.replace(/```json|```/gi,'').trim();
  const start = stripped.indexOf('[');
  if (start===-1) throw new Error('Could not parse JSON from response');
  // Strip control characters
  const raw = stripped.slice(start).replace(/[\x00-\x1F\x7F]/g,' ');
  // Try parsing as-is first
  try { return JSON.parse(raw); } catch(e) {}
  // Truncate to last complete object (find last '}' before ']')
  function truncateToComplete(s) {
    const lastClose = s.lastIndexOf('}');
    if (lastClose === -1) return s;
    return s.slice(0, lastClose+1) + ']';
  }
  try { return JSON.parse(truncateToComplete(raw)); } catch(e) {}
  // Last resort: extract individual objects and parse each one
  const items = [];
  const objRe = /\{[\s\S]*?\}(?=\s*[,\]])/g;
  let m;
  while ((m = objRe.exec(raw)) !== null) {
    try { items.push(JSON.parse(m[0])); } catch(e) {}
  }
  if (items.length > 0) return items;
  throw new Error('Could not parse JSON from response');
}

function downloadCSV(results) {
  const headers = ['Title','Client','Region','Sector','Stage','Urgency','Relevance','Value','Deadline','Type','Source','Overview','Context','Sector Fit','Scale Fit','Geo Fit','Win Probability','Verdict'];
  const rows = [headers.join(',')];
  SECTORS.forEach(sector => {
    (results[sector.id]||[]).forEach(opp => {
      rows.push([
        opp.title, opp.client, opp.region, sector.name, opp.stage, opp.urgency,
        opp.relevance, opp.value, opp.deadline, opp.type, opp.source,
        opp.overview, opp.context,
        opp.gia?.sectorFit, opp.gia?.scaleFit, opp.gia?.geoFit, opp.gia?.winProb, opp.gia?.verdict
      ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
    });
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gia-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function MapView({all}) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef([]);

  useEffect(() => {
    if (!containerRef.current || typeof L === 'undefined') return;
    const map = L.map(containerRef.current, {zoomControl:true}).setView([20,10],2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{
      attribution:'©OpenStreetMap ©CartoDB', subdomains:'abcd', maxZoom:19
    }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 50);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  useEffect(() => {
    if (!mapRef.current) return;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    all.forEach(opp => {
      if (typeof opp.lat !== 'number' || typeof opp.lng !== 'number') return;
      const color = opp.urgency==='High'?'#FF5252':opp.urgency==='Medium'?'#FFAB40':'#7C4DFF';
      const m = L.circleMarker([opp.lat, opp.lng], {
        radius:8, fillColor:color, color:'rgba(0,0,0,0.4)', weight:1, opacity:0.9, fillOpacity:0.75
      }).addTo(mapRef.current).bindPopup(
        `<div style="font-family:monospace;font-size:11px;min-width:200px;line-height:1.6">
          <div style="font-weight:700;margin-bottom:4px">${opp.title}</div>
          <div>${opp.client}</div>
          <div style="color:#888">${opp.region}${opp.value?' · '+opp.value:''}</div>
          <div style="margin-top:6px"><span style="color:${color};font-weight:600">${opp.urgency}</span> · ${opp.stage}</div>
        </div>`
      );
      markersRef.current.push(m);
    });
  }, [all]);

  const mapped = all.filter(o => typeof o.lat === 'number').length;
  return React.createElement('div', {className:'map-wrap'},
    React.createElement('div', {ref:containerRef, style:{height:'100%',width:'100%'}}),
    React.createElement('div', {className:'map-legend'},
      React.createElement('div', {className:'map-legend-row'}, React.createElement('div', {className:'map-dot', style:{background:'#FF5252'}}), 'High Urgency'),
      React.createElement('div', {className:'map-legend-row'}, React.createElement('div', {className:'map-dot', style:{background:'#FFAB40'}}), 'Medium Urgency'),
      React.createElement('div', {className:'map-legend-row'}, React.createElement('div', {className:'map-dot', style:{background:'#7C4DFF'}}), 'Low Urgency'),
      React.createElement('div', {className:'map-count'}, mapped + ' project' + (mapped!==1?'s':'') + ' mapped')
    )
  );
}

        React.createElement('div', {className:'sources-title'}, 'Procurement Sources'),

            )
          )

      })
    )
  );
}

function ScoreRing({score}) {
  const r=17, c=2*Math.PI*r, offset=c-(score/100)*c;
  const color = score>=75?'#00E676':score>=55?'#FFAB40':'#FF5252';
  return React.createElement('div',{className:'score-ring'},
    React.createElement('svg',{viewBox:'0 0 44 44'},
      React.createElement('circle',{cx:22,cy:22,r,fill:'none',strokeWidth:3,stroke:'#2e3852'}),
      React.createElement('circle',{cx:22,cy:22,r,fill:'none',strokeWidth:3,stroke:color,strokeLinecap:'round',style:{strokeDasharray:c,strokeDashoffset:offset}})
    ),
    React.createElement('div',{className:'score-label',style:{color}},score)
  );
}

function App() {
  const [active,setActive] = useState(null);
  const [region,setRegion] = useState('Global');
  const [results,setResults] = useState({});
  const [scanning,setScanning] = useState(null);
  const [error,setError] = useState(null);
  const [progress,setProgress] = useState(null);
  const [activeTab,setActiveTab] = useState('results');
  const [sources,setSources] = useState(ALL_SOURCES.map(s=>({...s,enabled:true})));
  const [saveFlash,setSaveFlash] = useState(false);
  const [showLoad,setShowLoad] = useState(false);
  const [savedSearches,setSavedSearches] = useState(()=>{ try { return JSON.parse(localStorage.getItem('gia_searches')||'[]'); } catch(e) { return []; } });
  const [demo,setDemo] = useState(isDemo);
  const [showKey,setShowKey] = useState(false);
  const loadRef = useRef(null);

  const applyKey = useCallback((k) => {
    setGeminiKey(k);
    setDemo(isDemo());
    setResults({}); setActive(null); setError(null); setShowKey(false);
  }, []);

  useEffect(() => {
    if (!showLoad) return;
    const handler = e => { if (loadRef.current && !loadRef.current.contains(e.target)) setShowLoad(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showLoad]);

  const all = Object.values(results).flat().filter(Boolean);
  const avgScore = all.length ? Math.round(all.reduce((a,o)=>a+o.relevance,0)/all.length) : '--';
  const enabledSources = sources.filter(s=>s.enabled);

  const autoDownload = useCallback((sectorName, opps) => {
    const now = new Date();
    const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')
      +'_'+String(now.getHours()).padStart(2,'0')+'-'+String(now.getMinutes()).padStart(2,'0')+'-'+String(now.getSeconds()).padStart(2,'0');
    const slug = sectorName.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
    const clean = v => typeof v === 'string' ? v.replace(/[\x00-\x1F\x7F]/g,' ').trim() : v;
    const sanitised = JSON.parse(JSON.stringify({timestamp:now.toISOString(), sector:sectorName, region, opportunities:opps}, (_,v)=>clean(v)));
    const blob = new Blob([JSON.stringify(sanitised,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${ts}_${slug}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }, [region]);

  const scan = useCallback(async(s) => {
    setScanning(s.id); setError(null); setActive(s.id);
    try {
      const o = await fetchOpportunities(s.name, region, enabledSources);
      setResults(r=>({...r,[s.id]:o}));
      if (!isDemo()) autoDownload(s.name, o);
    }
    catch(e) { setError(e.message); }
    finally { setScanning(null); }
  }, [region, enabledSources, autoDownload]);

  const scanAll = useCallback(async() => {
    setError(null);
    for(let i=0;i<SECTORS.length;i++){
      const s=SECTORS[i]; setProgress(`${i+1}/${SECTORS.length}`); setScanning(s.id); setActive(s.id);
      try{
        const o=await fetchOpportunities(s.name,region,enabledSources);
        setResults(r=>({...r,[s.id]:o}));
        if (!isDemo()) autoDownload(s.name, o);
      }catch(e){}
      setScanning(null);
      if(i<SECTORS.length-1) await new Promise(r=>setTimeout(r,isDemo()?250:4000));
    }
    setProgress(null);
  }, [region, enabledSources, autoDownload]);

  const handleSave = useCallback(() => {
    // Save to localStorage for Load button
    let searches = [];
    try { searches = JSON.parse(localStorage.getItem('gia_searches')||'[]'); } catch(e) {}
    searches.unshift({id:Date.now(), label:`${demo?'Sample · ':''}${region} · ${new Date().toLocaleDateString()}`, region, results, savedAt:new Date().toISOString()});
    const updated = searches.slice(0,10);
    try { localStorage.setItem('gia_searches', JSON.stringify(updated)); } catch(e) {}
    setSavedSearches(updated);
    // Download all current results as a single JSON file
    const now = new Date();
    const ts = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')
      +'_'+String(now.getHours()).padStart(2,'0')+'-'+String(now.getMinutes()).padStart(2,'0');
    const clean = v => typeof v === 'string' ? v.replace(/[\x00-\x1F\x7F]/g,' ').trim() : v;
    const sanitised = JSON.parse(JSON.stringify({timestamp:now.toISOString(), region, results}, (_,v)=>clean(v)));
    const blob = new Blob([JSON.stringify(sanitised,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${ts}_all-results.json`;
    a.click();
    URL.revokeObjectURL(url);
    setSaveFlash(true);
    setTimeout(()=>setSaveFlash(false), 2000);
  }, [results, region, demo]);

  const handleLoad = useCallback((search) => {
    setResults(search.results);
    setRegion(search.region);
    setActive(null);
    setShowLoad(false);
  }, []);

  const busy = scanning !== null;
  const cur = active ? (results[active]||[]) : [];
  const curS = SECTORS.find(s=>s.id===active);
  const today = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();

  const toggleSource = id => setSources(s=>s.map(x=>x.id===id?{...x,enabled:!x.enabled}:x));
  const toggleCat = (cat, on) => setSources(s=>s.map(x=>x.cat===cat?{...x,enabled:on}:x));

  return React.createElement('div', {id:'root'},
    React.createElement('div', {className:'topbar'},
      React.createElement('div', {className:'topbar-logo'},
        React.createElement('span', {className:'topbar-sub'}, 'Strategic Project Discovery')
      ),
      React.createElement('div', {className:'topbar-right'},
        demo
          ? React.createElement('div', {className:'mode-pill mode-demo'}, 'DEMO · SAMPLE DATA')
          : React.createElement(React.Fragment, null,
              React.createElement('div', {className:'live-dot'}),
              React.createElement('div', {className:'topbar-meta'}, 'LIVE · GEMINI · '+today)
            ),
        React.createElement('button', {className:'folder-btn', onClick:()=>setShowKey(true)},
          React.createElement(Icon,{name:'KeyRound',size:11}), demo ? ' Use your Gemini key' : ' API key')
      )
    ),
    demo && React.createElement('div', {className:'demo-banner'},
      React.createElement(Icon,{name:'Info',size:13}),
      React.createElement('span', null, 'You’re viewing sample data: every opportunity here is fictional and for illustration only. Add a Gemini API key to run live AI searches of real procurement sources.'),
      React.createElement('button', {className:'demo-banner-btn', onClick:()=>setShowKey(true)}, 'Add key')
    ),
    showKey && React.createElement(KeyModal, {onSave:applyKey, onClose:()=>setShowKey(false), hasKey:!demo}),
    React.createElement('div', {className:'main-layout'},
      React.createElement('div', {className:'sidebar'},
        React.createElement('div', {className:'sidebar-header'}, 'Infrastructure Sectors'),
        React.createElement('div', {className:'sidebar-sectors'},
          ...SECTORS.map(s => React.createElement('div', {
            key:s.id,
            className:`sector-item${active===s.id?' active':''}${scanning===s.id?' scanning':''}`,
            onClick:()=>{ setActive(s.id); setActiveTab('results'); if(!results[s.id]&&scanning!==s.id) scan(s); }
          },
            React.createElement('div', {className:'sector-icon'},
              scanning===s.id
                ? React.createElement(Icon,{name:'Loader',size:14,style:{animation:'spin 1s linear infinite',color:'var(--cyan)'}})
                : React.createElement(Icon,{name:s.icon,size:14,style:{color:active===s.id?'var(--cyan)':'var(--tm)'}})
            ),
            React.createElement('div', {className:'sector-text'},
              React.createElement('div', {className:'sector-name'}, s.name),
              React.createElement('div', {className:'sector-count'}, results[s.id]?`${results[s.id].length} opportunities`:scanning===s.id?'scanning…':'click to scan')
            ),
            results[s.id] && React.createElement('div', {className:'sector-badge'}, results[s.id].length)
          ))
        ),
        React.createElement('div', {className:'sidebar-footer'},
          React.createElement('button', {className:`scan-all-btn${progress?' scanning':''}`, onClick:scanAll, disabled:busy},
            busy && React.createElement('div', {className:'spinner'}),
            progress ? `Scanning ${progress}…` : React.createElement(React.Fragment,null,React.createElement(Icon,{name:'ScanLine',size:14}),' Scan All Sectors')
          )
        )
      ),
      React.createElement('div', {className:'content-panel'},
        React.createElement('div', {className:'toolbar'},
          React.createElement('div', {className:'toolbar-title'},
            activeTab==='sources' ? 'PROCUREMENT SOURCES' : activeTab==='sectors' ? 'SECTOR DEFINITIONS' : activeTab==='definitions' ? 'GLOSSARY & DEFINITIONS' : curS ? curS.name.toUpperCase() : 'SELECT A SECTOR'
          ),
          activeTab !== 'sources' && activeTab !== 'sectors' && activeTab !== 'definitions' && React.createElement('select', {className:'region-select', value:region, onChange:e=>setRegion(e.target.value)},
            ...REGIONS.map(r => React.createElement('option', {key:r, value:r}, r))
          ),
          activeTab === 'results' && curS && !['sources','sectors','definitions'].includes(activeTab) && React.createElement('button', {className:'scan-btn', onClick:()=>scan(curS), disabled:busy},
            scanning===active && React.createElement('div', {className:'spinner'}),
            scanning===active ? 'Scanning…' : React.createElement(React.Fragment,null,React.createElement(Icon,{name:'RefreshCw',size:12}),' Re-Scan')
          ),
          React.createElement('div', {className:'load-wrap', ref:loadRef},
            React.createElement('button', {className:'action-btn', onClick:()=>setShowLoad(v=>!v)}, React.createElement(Icon,{name:'FolderOpen',size:12}),' Load'),
            showLoad && React.createElement('div', {className:'load-dropdown'},
              savedSearches.length === 0
                ? React.createElement('div', {className:'load-empty'}, 'No saved searches')
                : savedSearches.map(s =>
                    React.createElement('div', {key:s.id, className:'load-item', onClick:()=>handleLoad(s)},
                      React.createElement('div', {className:'load-item-label'}, s.label),
                      React.createElement('div', {className:'load-item-meta'},
                        Object.keys(s.results).length + ' sectors · ' + new Date(s.savedAt).toLocaleString()
                      )
                    )
                  )
            )
          ),
        ),
        React.createElement('div', {className:'tab-bar'},
          ['results','map','sources','sectors','definitions'].map(tab =>
            React.createElement('button', {
              key:tab,
              className:`tab-btn${activeTab===tab?' active':''}`,
              onClick:()=>setActiveTab(tab)
            }, tab==='results'?'Results':tab==='map'?'World Map':tab==='sources'?'Sources':tab==='sectors'?'Sectors':'Definitions')
          )
        ),
        activeTab==='results' && React.createElement('div', {className:'results-area'},
          error && React.createElement('div', {className:'error-msg'}, '⚠ '+error),
          !active && React.createElement('div', {className:'empty-state'},
            React.createElement('div', {className:'empty-icon'}, React.createElement(Icon,{name:'Compass',size:36,strokeWidth:1})),
            React.createElement('div', {className:'empty-title'}, 'SELECT A SECTOR TO SCAN'),
            React.createElement('div', {className:'empty-sub'}, 'Choose a sector from the sidebar, or use Scan All Sectors for a full sweep.')
          ),
          active&&scanning===active&&cur.length===0 && React.createElement('div', {className:'scanning-state'},
            React.createElement('div', {className:'scan-ring'}),
            React.createElement('div', {className:'scan-text'}, 'SCANNING PROCUREMENT CHANNELS'),
            React.createElement('div', {className:'scan-sub'}, curS?.name+' · '+region)
          ),
          active&&scanning!==active&&cur.length===0&&!error && React.createElement('div', {className:'empty-state'},
            React.createElement('div', {className:'empty-icon'}, React.createElement(Icon,{name:'RefreshCw',size:36,strokeWidth:1})),
            React.createElement('div', {className:'empty-title'}, 'NO RESULTS YET'),
            React.createElement('div', {className:'empty-sub'}, 'Click Re-Scan to fetch opportunities.')
          ),
          ...cur.map((opp,i) => React.createElement(Card, {key:i, opp, idx:i}))
        ),
        activeTab==='map' && React.createElement(MapView, {all}),
        activeTab==='sources' && React.createElement(SourcesPanel, {
          sources,
          onToggle: toggleSource,
          onToggleCat: toggleCat,
          onSelectAll: ()=>setSources(s=>s.map(x=>({...x,enabled:true}))),
          onSelectNone: ()=>setSources(s=>s.map(x=>({...x,enabled:false})))
        }),
        activeTab==='sectors' && React.createElement(SectorsPanel, null),
        activeTab==='definitions' && React.createElement(DefinitionsPanel, null)
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
